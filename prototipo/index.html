<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasa</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06080c;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      /* Contador de quadros: só com ?perf (dev). */
      #fps {
        display: none;
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 10px;
        background: rgba(12, 17, 24, 0.6);
        color: #ffb060;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
      }
      body.perf #fps {
        display: block;
      }

      /* Tela de carregamento: as mesmas cores e fontes do design system (tokens.css), com
         valores de reserva porque o CSS do jogo chega junto com o JavaScript. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(ellipse at 50% 62%, rgba(217, 78, 10, 0.1), transparent 60%), var(--ink-950, #06080c);
      }
      #loading .ld-mark {
        font-family: var(--font-display, "Cinzel", Georgia, serif);
        font-weight: 700;
        font-size: clamp(46px, 14vw, 84px);
        letter-spacing: 0.14em;
        line-height: 1;
        background: linear-gradient(180deg, var(--gold-100, #fff1cf) 0%, var(--gold-300, #f2c46d) 46%, var(--ember-500, #ff6a13) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 24px rgba(255, 138, 44, 0.35)) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.75));
      }
      /* Uma brasa que pulsa, a assinatura do título. */
      #loading .ld-ember {
        width: 12px;
        height: 12px;
        transform: rotate(45deg);
        background: linear-gradient(0deg, var(--ember-500, #ff6a13), var(--ember-200, #ffd9a8));
        box-shadow: 0 0 22px rgba(255, 138, 44, 0.55);
        animation: ld-pulse 1.8s ease-in-out infinite;
      }
      @keyframes ld-pulse {
        0%, 100% { opacity: 0.55; box-shadow: 0 0 14px rgba(255, 138, 44, 0.35); }
        50% { opacity: 1; box-shadow: 0 0 34px rgba(255, 138, 44, 0.75); }
      }
      #loading .ld-text {
        margin: 0;
        max-width: 80vw;
        font-family: var(--font-text, "EB Garamond", Georgia, serif);
        font-style: italic;
        font-size: var(--fs-md, 17px);
        color: var(--text-mid, #bdb299);
      }
      #loading.ld-error .ld-text {
        color: var(--blood-400, #d9473a);
        font-style: normal;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ld-ember {
          animation: none;
        }
      }
      /* O atributo `hidden` precisa vencer o `display: flex` acima. */
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div class="ld-mark">Brasa</div>
      <div class="ld-ember" aria-hidden="true"></div>
      <p class="ld-text" id="loading-text">Carregando...</p>
    </div>
    <div id="fps" hidden>-- fps</div>
    <script>
      if (/[?&]perf\b/.test(location.search)) document.body.classList.add("perf");
      if (!/^pt/i.test(navigator.language || "pt")) document.getElementById("loading-text").textContent = "Loading...";
    </script>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
